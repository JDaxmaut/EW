{% load wagtailcore_tags wagtailimages_tags humanize ruplural %}
<div class="flex flex-col md:flex-row gap-[clamp(16px,2.5vw,36px)] py-6">
  <div class="flex-1 text-[clamp(14px,1.3vw,16.5px)] leading-airy text-ink-80">
    {{ value.text|richtext }}
  </div>
  {% if value.image %}
    {% image value.image fill-600x400 format-webp as day_img %}
    <div class="flex-shrink-0 w-full md:w-[clamp(180px,24vw,280px)]
                h-[200px] md:h-[clamp(140px,17vw,190px)] rounded-soft overflow-hidden shadow-zen">
      <img src="{{ day_img.url }}" alt="" loading="lazy" decoding="async" class="w-full h-full object-cover">
    </div>
  {% endif %}
</div>
