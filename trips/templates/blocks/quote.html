<section class="bg-mint-wash py-[clamp(64px,12vh,150px)] px-[clamp(20px,6vw,96px)]">
  <div class="max-w-[860px] mx-auto text-center">
    <div class="font-serif font-medium text-[clamp(24px,3.4vw,44px)] leading-[1.3] text-ink text-balance">
      «{{ value.text }}»
    </div>
    {% if value.author %}
      <div class="mt-7 font-sans text-[12px] uppercase tracking-[0.2em] text-turquoise-700">
        {{ value.author }}
      </div>
    {% endif %}
  </div>
</section>
