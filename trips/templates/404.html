{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<main>
  <div class="wrap page-head" style="text-align:center">
    <p class="eyebrow">Ошибка 404</p>
    <h1>Страница <em>потерялась</em></h1>
    <p class="section-sub" style="margin-left:auto;margin-right:auto">
      Такой страницы нет. Но есть куча других: загляните в каталог.</p>
    <div class="hero-actions" style="justify-content:center;margin-top:28px">
      {% slugurl 'catalog' as catalog_url %}
      <a class="btn btn-coral" href="{{ catalog_url|default:'/catalog/' }}">Направления</a>
      <a class="btn btn-ghost" href="/">На главную</a>
    </div>
  </div>
</main>
{% endblock %}
