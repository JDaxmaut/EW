<div class="px-[clamp(16px,3vw,32px)] py-[clamp(20px,3vw,32px)] border-r border-mint-line last:border-r-0">
  <div class="flex items-center gap-2.5 mb-2">
    {% if icon == "route" %}
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#00A796" stroke-width="1.5" stroke-linecap="round">
        <circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18h5a4 4 0 0 0 0-8h-3a4 4 0 0 1 0-8h5"/>
      </svg>
    {% elif icon == "clock" %}
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#00A796" stroke-width="1.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
      </svg>
    {% elif icon == "calendar" %}
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#00A796" stroke-width="1.5" stroke-linecap="round">
        <rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
      </svg>
    {% else %}
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#00A796" stroke-width="1.5" stroke-linecap="round">
        <path d="M4 18.5V8l8-4 8 4v10.5"/><path d="M8 18.5V12h8v6.5"/>
      </svg>
    {% endif %}
    <span class="font-sans text-[10.5px] uppercase tracking-[0.18em] text-ink-60">{{ label }}</span>
  </div>
  <div class="font-serif text-[clamp(17px,1.8vw,21px)] leading-snug text-ink">
    {% if value %}{{ value }}{% else %}—{% endif %}
  </div>
</div>
