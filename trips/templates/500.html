<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Что-то пошло не так</title>
  <style>
    :root { --ink:#063D3A; --mint-100:#C6F4EC; --mint-wash:#E9FBF8; --coral:#C93C1B; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; background:#fff; color:var(--ink);
           min-height:100vh; display:flex; align-items:center; justify-content:center;
           padding:24px; text-align:center; }
    .code { font-family: Georgia, serif; font-size: clamp(80px,18vw,200px);
            line-height:1; color:var(--mint-100); }
    h1 { font-family: Georgia, serif; font-weight:500; font-size: clamp(24px,4vw,40px); margin:8px 0 0; }
    p { color:#3E7C77; font-size:15px; line-height:1.7; max-width:46ch; margin:18px auto 0; }
    .actions { margin-top:32px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-flex; align-items:center; border-radius:999px; padding:16px 32px;
            font-size:13px; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; }
    .btn-primary { background:var(--coral); color:#fff; }
    .btn-secondary { border:1px solid #00C2B0; color:var(--ink); }
  </style>
</head>
<body>
  <div>
    <div class="code">500</div>
    <h1>Что-то пошло не так</h1>
    <p>Мы уже знаем о проблеме и разбираемся. Попробуйте обновить страницу
       или напишите нам — так мы узнаем быстрее.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">На главную</a>
      <a class="btn btn-secondary" href="/contacts/">Написать нам</a>
    </div>
  </div>
</body>
</html>
