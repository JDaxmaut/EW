{% load wagtailcore_tags wagtailimages_tags humanize ruplural %}
<div class="h-full">
  {% if value.image %}
    {% image value.image fill-600x450 format-webp as stay_img %}
    <div class="rounded-soft overflow-hidden shadow-zen mb-4 aspect-[4/3]">
      <img src="{{ stay_img.url }}" alt="{{ value.name }}" loading="lazy" decoding="async"
           class="w-full h-full object-cover">
    </div>
  {% endif %}
  <div class="font-serif text-[20px] text-ink mb-1">{{ value.name }}</div>
  {% if value.kind %}
    <div class="text-[11.5px] uppercase tracking-[0.14em] text-turquoise-700 mb-3">{{ value.kind }}</div>
  {% endif %}
  {% if value.text %}
    <p class="m-0 text-[13.5px] leading-relaxed text-ink-60">{{ value.text }}</p>
  {% endif %}
</div>
