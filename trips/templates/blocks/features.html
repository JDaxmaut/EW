<section class="bg-white py-[clamp(56px,9vh,110px)] px-[clamp(20px,6vw,96px)]">
  <div class="max-w-[1240px] mx-auto">
    <div class="max-w-[720px] mb-[clamp(32px,5vw,56px)]">
      <h2 class="h-section text-ink text-[clamp(28px,4vw,52px)]">{{ value.heading }}</h2>
    </div>

    {# Четыре блока текста вразнобой, а не «четыре иконки в кружках» #}
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-x-[clamp(24px,4vw,56px)] gap-y-[clamp(28px,4vw,44px)]">
      {% for item in value.items %}
        <div class="border-t-2 border-turquoise pt-5">
          <h3 class="font-serif text-[clamp(20px,2vw,24px)] leading-snug text-ink">{{ item.title }}</h3>
          {% if item.text %}
            <p class="mt-3 text-[14px] leading-relaxed text-ink-60">{{ item.text }}</p>
          {% endif %}
        </div>
      {% endfor %}
    </div>
  </div>
</section>
